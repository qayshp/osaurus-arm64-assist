name: Source and evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Official v4/v5 tag refs resolved on 2026-11-15; these are fixed pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked dependencies and build tools
        run: |
          python -I -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Install the companion package
        run: |
          python -I -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Run unit and protocol tests
        run: python -m unittest discover -s tests -v
      - name: Validate public evidence
        run: python evidence/check_public_evidence.py

  powershell7:
    name: PowerShell 7 safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the requested PowerShell engine
        shell: pwsh
        run: |
          $PSVersionTable | Format-Table -AutoSize
          if ($PSVersionTable.PSVersion.Major -ne 7) {
            throw 'The requested PowerShell major version was not selected.'
          }
      - name: Parse lifecycle scripts without executing them
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell parsing failed.' }
      - name: Exercise isolated filesystem and process safety guards
        shell: pwsh
        run: .\scripts\Test-SafetyGuards.ps1
      - name: Exercise isolated automatic lifecycle guards
        shell: pwsh
        run: .\scripts\Test-AutoStartGuards.ps1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise proxy-free loopback HTTP
        shell: pwsh
        run: .\scripts\Test-LoopbackHttp.ps1

  powershell51:
    name: Windows PowerShell 5.1 safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the requested PowerShell engine
        shell: powershell
        run: |
          $PSVersionTable | Format-Table -AutoSize
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Windows PowerShell 5.1 is required for the compatibility check.'
          }
      - name: Parse lifecycle scripts without executing them
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell parsing failed.' }
      - name: Exercise isolated filesystem and process safety guards
        shell: powershell
        run: .\scripts\Test-SafetyGuards.ps1
      - name: Exercise isolated automatic lifecycle guards
        shell: powershell
        run: .\scripts\Test-AutoStartGuards.ps1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise proxy-free loopback HTTP
        shell: powershell
        run: .\scripts\Test-LoopbackHttp.ps1

  # Hosted runners do not establish signed-DSP provisioning or physical NPU use.
  # Hardware smoke results must be reported separately with their exact stack.
