[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "osaurus-arm64-assist"
version = "0.1.1"
description = "Experimental local CPU, Adreno and Hexagon inference profiles for Osaurus on Windows ARM64"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Jinja2==3.1.6", "MarkupSafe==3.0.4", "fastjsonschema==2.22.3"]

[project.scripts]
osaurus-arm64-assist = "osaurus_arm64_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osaurus_arm64_assist = ["native.lock.json"]
